# Configuração Oficial do Netlify para o Curso Quant Research
# Publicação exclusiva da Landing Page de Análise Quantitativa Aplicada

[build]
  publish = "landing_pages"

# Redirecionamentos para rotas canônicas
[[redirects]]
  from = "/quant"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/analise_quantitativa"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/analise_quantitativa.html"
  to = "/index.html"
  status = 301

# Atalhos para Landing Page de Macro & Assessores e Portal
[[redirects]]
  from = "/macro"
  to = "/macro_assessores.html"
  status = 301

[[redirects]]
  from = "/assessores"
  to = "/macro_assessores.html"
  status = 301

[[redirects]]
  from = "/portal"
  to = "/portal_cursos.html"
  status = 301

# Atalhos diretos para download do Kit de Nivelamento e Ementa (PDF)
[[redirects]]
  from = "/kit"
  to = "/downloads/Kit_Nivelamento_e_Ementa_Analise_Quantitativa.pdf"
  status = 302

[[redirects]]
  from = "/ementa"
  to = "/downloads/Kit_Nivelamento_e_Ementa_Analise_Quantitativa.pdf"
  status = 302

# Cabeçalhos de Segurança e Performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/downloads/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=31536000"
