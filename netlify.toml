# Configuração Oficial do Netlify para o Curso Quant Research
# Publicação da Landing Page (PT & EN)

[build]
  publish = "landing_pages"

# Redirecionamentos para rotas canônicas em Português
[[redirects]]
  from = "/quant"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/analise_quantitativa"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/analise_quantitativa.html"
  to = "/index.html"
  status = 301

# Redirecionamentos para rotas em Inglês (English Track)
[[redirects]]
  from = "/en"
  to = "/index_en.html"
  status = 301

[[redirects]]
  from = "/en/"
  to = "/index_en.html"
  status = 301

[[redirects]]
  from = "/english"
  to = "/index_en.html"
  status = 301

[[redirects]]
  from = "/quant/en"
  to = "/index_en.html"
  status = 301

# Atalhos diretos para download do Kit de Nivelamento e Ementa
[[redirects]]
  from = "/kit"
  to = "/downloads/Kit_Nivelamento_e_Ementa_Analise_Quantitativa.pdf"
  status = 302

[[redirects]]
  from = "/ementa"
  to = "/downloads/Kit_Nivelamento_e_Ementa_Analise_Quantitativa.pdf"
  status = 302

[[redirects]]
  from = "/kit/en"
  to = "/downloads/Kit_Quant_Research_Syllabus_Leveling_Guide_EN.pdf"
  status = 302

[[redirects]]
  from = "/syllabus"
  to = "/downloads/Kit_Quant_Research_Syllabus_Leveling_Guide_EN.pdf"
  status = 302

# Cabeçalhos de Segurança e Performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
